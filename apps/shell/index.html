<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101418'/%3E%3Cpath d='M16 18h13l3 10 3-10h13L38 47H26Z' fill='%2338bdf8'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Newma-Dock：面向人和 Agent 的可生长工作台"
    />
    <script>
      try {
        const mode = localStorage.getItem("vibedesk.themeMode") || "system";
        const dark =
          mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Newma-Dock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
