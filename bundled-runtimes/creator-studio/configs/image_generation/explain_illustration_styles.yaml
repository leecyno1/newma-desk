# 文章说明图风格库 v2（账号 DNA 绑定版）
# 用途：transwrite/article_build 环节的 AI 说明图——按公众号账号 DNA 路由角色与风格
# 权威档案：dna/account_dna.yaml（单一事实源）；skill：skills/dasheng-account-illustrations/
# 原则：说明图只做概念表达（schematic）；数据一律由 matplotlib 数据图承载
# v1 的 4 通用风格降级为「无账号上下文时的备选」

version: "2.3"

account_styles:
  - account_id: slot-1
    account_name: 默丘利Lab
    character: 胖版墨丘利 + 胖版奥林匹斯固定角色组
    style: 胖版 Q 萌希腊神话构图 + 精美简笔陶罐画
    color: 米白底 + 墨黑线条 + 赭红/爱琴海蓝双强调
    layout: 按财经机制选择固定神话角色，每图一个叙事节拍，最多三角色
    aspect: 1792x1024
    cast_roles:
      mercury: 信息传导、交易、价格发现、资金流动
      zeus: 主权、央行、监管、最高决策与系统性冲击
      athena: 研究、策略、资产配置与风险管理
      poseidon: 流动性、波动、大宗商品与周期
      hades: 债务、信用风险、隐性负债与尾部风险
      hephaestus: 制造、基础设施、产能与资本开支
      apollo: 技术创新、增长、生产率与乐观预期
      ares: 商业竞争、价格战、地缘冲突与军备赛
    prompt_template: |
      一张 16:9 横版胖版 Q 萌希腊神话说明插画，保留精美陶罐画线条。
      【本镜角色】{{characters}}。按财经机制从固定角色中选角：墨丘利=信息/交易/资金，
      宙斯=主权/央行/监管，雅典娜=策略/配置/风控，波塞冬=流动性/波动/商品周期，
      哈迪斯=债务/信用/尾部风险，赫菲斯托斯=制造/基建/资本开支，
      阿波罗=技术/增长/生产率，阿瑞斯=竞争/价格战/冲突。
      所有角色统一是大圆头、圆滚短身、短手短腿的胖版造型，表情可爱但不幼稚；
      保留各自标志物，同一角色跨图的体型、颜色、脸部比例完全一致。
      线条干净、有希腊陶罐画的装饰韵律，禁止 3D 玩偶和糖果萌系渐变。
      配色：米白底 + 墨黑主线条 + 赭红与爱琴海蓝双强调色（希腊陶器色系）。
      场景：{{scene}}。核心动作：{{action}}（一图一个机制，最多三个角色）。
      标注：{{labels}}（少量中文，可选希腊式花体英文小注）。
      约束：无写实人脸细节、无渐变彩色、无 3D；无事实数据出现在图中。

  - account_id: slot-3
    account_name: Newma牛马进化论
    character: 牛人 + 马人（仅开篇一问一答）
    style: 儿童手绘，故意粗制滥造（小学生手工报美学）
    color: 荧光绿 + 土黄 + 大红 + 黑（廉价感配色）
    layout: 文章开篇单幅横版漫画；牛人提问，马人一句话给出全文中心判断；正文禁用牛马人物图
    aspect: 1792x1024（单幅对话）
    prompt_template: |
      一张 16:9 横版文章开篇儿童手绘漫画，画风故意粗制滥造：
      歪歪扭扭的线条、廉价感配色（荧光绿+土黄+大红+黑），像小学生手工报——
      粗糙是刻意的表达，与内容的严谨形成反差萌。
      【固定双角色】牛人：卡通牛头人身，土黄+大红主色，表情憨厚（务实派）；
      马人：卡通马头人身，荧光绿+黑主色，表情亢奋（激进派）。
      场景：{{scene}}。互动：{{exchange}}（严格一问一答：牛人提出读者最直观的疑问，
      马人用一句简短回答概括全文核心判断，不增加第三句）。
      标注：{{labels}}（全部手写体，歪歪扭扭，但中文准确、短促、移动端可读）。
      约束：禁止精美渐变、禁止商业矢量风、禁止精致圆滑线条——太精美 = 不合格；
      仅用于开篇；正文机制图和数据图不得出现牛人或马人；无事实数据出现在图中。

  - account_id: slot-2
    account_name: 墨丘利实验室
    character: 原版小黑（ian-xiaohei 上游原生，非柠檬人）
    style: 小黑黑金实验室手绘（严肃财经研究美学）
    color: 黑曜石黑 + 暖金 + 淡金 + 米白，深红只作风险警示
    layout: 单概念单图（一图一动作）；小黑必须操作仪器、阀门、天平或研究台
    aspect: 1792x1024
    prompt_template: |
      一张 16:9 横版小黑黑金实验室手绘说明插画。
      【固定角色】原版小黑：黑色简笔小人——圆头黑色剪影身体、极细黑色线四肢、
      无面部细节（或仅两个米白点眼睛），认真严肃的系统操作员；黑底时必须有暖金或米白轮廓。
      注意：不是柠檬人——无黄色身体、无叶子，纯黑线白底极简形态。
      画风：黑曜石黑背景、暖金与淡金严谨线稿、米白仪表面板，深红仅作一个警示点。
      场景：{{scene}}（实验室语境）。核心动作：{{action}}（一图一动作：
      操作仪器/搬运数据/核对报表/调节阀门/校准天平）。小黑必须承担核心动作，不能站桩。
      标注：{{labels}}（AI 原图尽量不用文字；必要文字由后期确定性排版添加）。
      约束：无商业矢量风、无 PPT 卡片、无正式流程图、无 3D、无渐变、无黄色柠檬人；
      一图只讲一个认知结构，无事实数据出现在 AI 插图中。

# 通用备选（无账号上下文时）
generic_styles:
  - id: lemon-xiaohei
    name: 小黑柠檬人手绘（旧默认，仅无账号上下文时用）
    note: 账号绑定后，柠檬人仅作通用备选——slot-2 用原版小黑（黑色），slot-3 用牛马双人
  - id: handdrawn-outline
    name: 手绘白描
  - id: manga-panel
    name: 漫画分格
  - id: lancet-academic
    name: 柳叶刀学术（结构图专用，可与任何账号角色组合）

usage_log:
