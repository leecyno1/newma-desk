    note: slot-3 调整为“开篇一张牛马手绘漫画 + 正文纯科技分析”；正文禁用人物对话，文章限制 3—5 章
  - date: "2026-08-24"
    note: slot-2 按用户样本升级为小黑黑金实验室视觉；数据图改由 Meta Pilot Lab 账号主题路由
  - date: "2026-08-24"
