schema_version: dasheng.video.pipeline.v1
id: commercial_promo
lane: commercial_promo_video
director_id: commercial_promo_director
standard_flow_ref: configs/video/director_registry.json#standard_flow
title: 广告宣传片流水线
orchestrator_skill: dasheng-commercial-promo-video
default_output_stage: video
supported_modes: [brand_film, product_promo, launch_trailer, performance_ad]
default_durations_sec: [15, 30, 60]
default_format:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  alternate_profiles: ["16:9", "1:1", "4:5"]
external_output_policy:
  required_root: "~/Desktop/自媒体创作"
  forbid_paths: ["skills/", ".codex/skills/", "node_modules/"]
human_approval_default: true
style_reference:
  primary: 品牌与产品转化型宣传片
  principle: 用品牌一致性、真实产品、可信证明、节拍和明确 CTA 建立记忆与转化，不承担长篇知识解释。
stages:
  - name: intake
    canonical_stage: intake
    description: 接收品牌系统、产品资料、受众、投放目标、平台规格、价格优惠、法律说明、官方资产、产品录屏或实拍及授权。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [brief]
    produces: [review]
    tools_available: [commercial_promo_package_builder, media_downloader, read_video_with_crv, image2]
    checkpoint_required: true
    review_focus:
      - 每条广告只能有一个主要转化目标和一个主 CTA。
      - Logo、颜色、字体、产品外观、价格、优惠、证明和授权必须可定位。
    success_criteria:
      - brand, product, audience, objective, format and duration are locked
      - official assets, product assets, claims, offer and legal copy are inventoried
      - rights and validity windows are documented
  - name: script_rewrite
    canonical_stage: script_rewrite
    description: 按钩子、痛点、产品承诺、卖点收益、真实证明、品牌记忆和 CTA 重写广告口播与屏幕短文案。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [brief, review]
    produces: [script]
    tools_available: [commercial_promo_package_builder]
    checkpoint_required: true
    review_focus:
      - 功能必须翻译为用户收益，屏幕短文案不得机械复制整句口播。
      - 价格、优惠、比较、性能和客户结果必须声明来源、口径和有效期。
    success_criteria:
      - schema-valid script artifact
      - hook, promise, benefit, proof, brand memory and CTA are present
      - copy fits the approved 15, 30 or 60 second profile
  - name: scene_plan
    canonical_stage: scene_plan
    description: 把广告脚本转成逐镜产品演示、品牌 Hero、证明、Logo、CTA、字幕、花字、节拍、音效和多比例安全区分镜。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [script]
    produces: [scene_plan, tool_routing_plan, review]
    tools_available: [commercial_promo_package_builder, video_director_tool_router, build_storyboard_template_review_table, shotcraft_adapter]
    checkpoint_required: true
    review_focus:
      - 产品在承诺后尽快出现，每个卖点有对应动作、收益和证明路线。
      - 高辨识度动效集中在 Hook、核心 Reveal、Proof 和 CTA。
      - Logo、字幕、产品界面、价格、优惠和 CTA 不得互相遮挡。
    success_criteria:
      - schema-valid scene_plan artifact
      - storyboard review approved
      - every scene has a commercial role, production route and brand-consistent motion plan
  - name: claim_compliance
    canonical_stage: scene_plan
    description: 对产品能力、性能、比较、客户结果、价格、优惠、期限和免责声明建立命题证据台账。
    skill: dasheng-video-director
    required_artifacts_in: [scene_plan]
    produces: [claim_evidence_ledger, spoken_revision_sheet, review]
    tools_available: [video_claim_evidence_ledger, video_official_evidence, video_model_evidence]
    checkpoint_required: true
    review_focus:
      - 生成画面、情境 B-roll 和品牌氛围不能作为产品功能或效果证明。
      - 证据冲突、优惠过期或免责声明缺失时先改脚本和屏幕文案。
    success_criteria:
      - schema-valid claim_evidence_ledger artifact
      - claim_evidence_gate status is pass
      - spoken_revision_sheet pending_count is 0
  - name: asset_build
    canonical_stage: asset_build
    description: 汇集官方品牌资产、产品录屏/实拍、证明材料和真实 B-roll，并生成 Hero、产品功能、数字、Logo、CTA、字幕、音乐和音效动画。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [scene_plan, claim_evidence_ledger]
    produces: [asset_manifest, renderer_asset_gate]
    tools_available: [media_downloader, image2, render_html_anything_scene_pack_animated, build_remotion_renderer_pack, text_to_lottie_local, shotcraft_adapter, mmx_cli]
    checkpoint_required: true
    review_focus:
      - 官方产品资产优先；生成式镜头只做概念、氛围或转场。
      - 所有 Logo、产品、证明、音乐和字体资产保留来源、授权和用途。
    success_criteria:
      - schema-valid asset_manifest artifact
      - renderer_asset_gate status is pass
      - no generated asset impersonates a real product screen, customer result or offer
  - name: edit_composite
    canonical_stage: edit_composite
    description: 在 Remotion 主时间轴合成产品实拍/录屏、HTML/HyperFrames/GSAP/Lottie、字幕、Logo、BGM、SFX、Offer、免责声明和 CTA。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [scene_plan, asset_manifest]
    produces: [edit_decisions]
    tools_available: [convert_director_storyboard_to_video_timeline, dasheng-caption-motion, build_remotion_renderer_pack, align_video_subtitles_to_asr, dasheng_ffmpeg_toolkit]
    checkpoint_required: true
    review_focus:
      - 主旁白只挂载一次，BGM 与音效服务节拍但不遮挡口播。
      - 屏幕文案、字幕、花字、Logo、价格、优惠和免责声明使用独立层级。
    success_criteria:
      - schema-valid edit_decisions artifact
      - product reveal, proof, brand memory and CTA are frame-aligned
      - captions and legal copy are readable in platform safe areas
  - name: render
    canonical_stage: render
    description: 渲染评审版和正式版，输出接触表，并验证 Remotion、HTML/HyperFrames 和音频真实消费分镜字段。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [edit_decisions, asset_manifest, renderer_asset_gate]
    produces: [review]
    tools_available: [render_html_anything_scene_pack_animated, build_remotion_renderer_pack, video_renderer_contract_gate]
    checkpoint_required: true
    success_criteria:
      - renderer contract gate status is pass
      - review render and contact sheet are available
      - all requested aspect profiles preserve product, logo, legal copy and CTA safe areas
  - name: qc_delivery
    canonical_stage: qc_delivery
    description: 检查品牌一致性、产品真实性、声明合规、字幕、价格优惠、CTA、节拍、响度、闪屏和最终文件绑定。
    skill: dasheng-commercial-promo-video
    required_artifacts_in: [edit_decisions, asset_manifest, renderer_asset_gate, review]
    produces: [render_report, review]
    tools_available: [build_video_review_suite_strict, video_render_qc, video_renderer_contract_gate, dasheng_ffmpeg_toolkit, video_final_delivery]
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - schema-valid render_report artifact
      - commercial claims and brand consistency review pass
      - video_qc_report status is pass
      - final delivery manifest points to the exact QC-passed video hash
fail_conditions:
  - brand system, audience, objective, product promise or primary CTA is not locked
  - unverified product capability, comparison, customer result, price or offer is presented as fact
  - generated product UI, testimonial or result is presented as real evidence
  - product is absent or appears only after most of the runtime without an approved brand-film exception
  - advertisement contains atmosphere and logo but no concrete benefit, proof or CTA
  - logo, color, typography, product appearance or brand voice changes without an approved reason
  - offer, expiry, restriction or disclaimer is missing, stale or unreadable
  - captions, product UI, logo, price, offer, CTA or legal copy collide in platform safe areas
  - master narration is mounted more than once or audio clips/pumps
  - final delivery manifest points to a different file, duration or hash than the QC report
  - final media is written under the skills directory
