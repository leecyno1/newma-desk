{% block meta %}
{% from instock.release import process_release %}
{% set release = process_release() %}
<meta name="instock-source-commit" content="{{ release['sourceCommit'] or 'unknown' }}" />
<meta name="instock-source-dirty" content="{{ 'true' if release['sourceDirty'] is True else 'false' if release['sourceDirty'] is False else 'unknown' }}" />
<meta name="instock-package-version" content="{{ release['packageVersion'] or 'unknown' }}" />
<meta name="spreadjs culture" content="zh-cn" />
<link rel="icon" href="/static/img/favicon.ico">
<link rel="stylesheet" href="/static/css/bootstrap.min-3.4.1.css" />
<link rel="stylesheet" href="/static/css/font-awesome.min-4.5.0.css" />
<script src="/static/js/jquery.min-3.7.1.js"></script>
<script type="text/javascript">
    if('ontouchstart' in document.documentElement) document.write("<script src='/static/js/jquery.mobile.custom.min.js'>"+"<"+"/script>");
</script>
<script src="/static/js/bootstrap.min-3.4.1.js"></script>
<style>
html,body {
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    height:100%;
}
</style>
{% end %}
