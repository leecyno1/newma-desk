[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seven-cycle-platform"
version = "0.1.0"
description = "Research platform for seven-cycle asset analysis."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<2.3",
    "pandas>=2.2,<2.3",
    "scipy>=1.15,<1.16",
    "statsmodels>=0.14,<0.15",
    "scikit-learn>=1.6,<1.7",
    "matplotlib>=3.10,<3.11",
    "pyarrow>=20,<21",
    "duckdb>=1.2,<1.3",
    "pydantic>=2.11,<2.12",
    "fastapi>=0.115,<0.121",
    "uvicorn>=0.34,<0.36",
    "pyyaml>=6.0,<7",
    "tushare>=1.4,<1.5",
    "akshare>=1.16.95,<1.16.96",
]

[project.scripts]
seven-cycle = "seven_cycle_platform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<0.29",
    "ruff>=0.13,<0.14",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that invoke legacy output verification scripts",
]
