indicators:
  - indicator_id: cn_pmi_manufacturing
    name_zh: 中国制造业采购经理指数
    name_en: China Manufacturing PMI
    concept: pmi
    concept_scope: systemic
    source: 国家统计局
    backend: akshare.macro_china_pmi
    frequency: M
    unit: index_points
    timezone: Asia/Shanghai
    transform: level_centered_at_50
    release_rule: 月后首个工作日按官方发布时间入库。
    revision_rule: 通常不修订；官方更正作为新 vintage 保存。
    quality_tier: A
    timing: coincident
    allowed_cycles: [C3, C4, C5, C6]
    allowed_lags: [0, 1, 2, 3]
    direction_prior: 1.0
    proxy: &primary_series
      is_proxy: false
      proxy_for: null
      effective_from: null
      effective_to: null
      is_current: false
      notes: 官方主序列，不使用代理。
    active: true

  - indicator_id: cn_pmi_new_orders
