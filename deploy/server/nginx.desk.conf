server {
    listen 5888;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://api:8911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Integrated Research/Trading pages are browser-facing children of the
    # Desk shell. Keep them on the same dedicated Desk Origin so remote
    # browsers never receive server-side 127.0.0.1 URLs.
    location /mod-runtime/ {
        proxy_pass http://api:8911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
