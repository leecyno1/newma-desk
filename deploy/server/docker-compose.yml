name: newma-desk

# Run from the repository root so Compose can interpolate required values:
# docker compose --env-file deploy/server/.env.server -f deploy/server/docker-compose.yml up -d

x-core-environment: &core-environment
  NEWMA_DESK_ENABLE_DOMAIN_SUITES: "true"
  NEWMA_DESK_INTEGRATED_DOMAIN_RUNTIME: "1"
  NEWMA_DESK_INVESTMENT_WORKSPACE: /app/mod-projects/vibe-research
  NEWMA_DESK_TRADING_WORKSPACE: /app/mod-projects/vibe-trading
  NEWMA_DESK_PROJECTS_ROOT: /projects
  NEWMA_DESK_DESKTOP_PROJECTS_ROOT: /projects
  NEWMA_DESK_RUNTIME_DIR: /app/runtime
  NEWMA_DESK_DATABASE_PATH: /app/runtime/newma-desk.db

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: newma-desk:server
    restart: unless-stopped
    env_file: .env.server
    environment:
      <<: *core-environment
      PATH: /app/runtime/codex/node_modules/.bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "8911:8911"
    volumes:
      - ../../runtime:/app/runtime
      - /opt/newma-projects:/projects
      - ../../runtime/codex-home:/root/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8911/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  market:
    image: newma-desk:server
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.server
    environment:
      VITE_API_PROXY_TARGET: http://api:8911
      VITE_GATEWAY_BASE_URL: "${PUBLIC_API_ORIGIN:?Set PUBLIC_API_ORIGIN in deploy/server/.env.server and pass --env-file deploy/server/.env.server}"
      VITE_PARENT_ORIGIN: "${PUBLIC_DESK_ORIGIN:?Set PUBLIC_DESK_ORIGIN in deploy/server/.env.server and pass --env-file deploy/server/.env.server}"
    command: ["npm", "run", "dev", "-w", "@newma-desk/market-pulse", "--", "--host", "0.0.0.0", "--port", "5891", "--strictPort"]
    ports:
      - "5891:5891"

  desk:
    image: newma-desk:server
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      market:
        condition: service_started
    env_file: .env.server
    environment:
      VITE_API_PROXY_TARGET: http://api:8911
      VITE_MOD_ORIGIN: "${PUBLIC_MOD_ORIGIN:?Set PUBLIC_MOD_ORIGIN in deploy/server/.env.server and pass --env-file deploy/server/.env.server}"
    command: ["npm", "run", "dev:shell", "--", "--host", "0.0.0.0", "--port", "5888", "--strictPort"]
    ports:
      - "5888:5888"

  register-mods:
    image: newma-desk:server
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.server
    environment:
      <<: *core-environment
      NEWMA_DESK_CONTROL_PLANE_URL: http://api:8911
    command: ["node", "scripts/register-store-defaults.mjs", "--api-url=http://api:8911"]
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      desk:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
