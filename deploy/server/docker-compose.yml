name: newma-desk

# Run from the repository root so Compose can interpolate required values:
# docker compose --env-file deploy/server/.env.server -f deploy/server/docker-compose.yml up -d

x-core-environment: &core-environment
  NEWMA_DESK_ENABLE_DOMAIN_SUITES: "true"
  NEWMA_DESK_INTEGRATED_DOMAIN_RUNTIME: "1"
  NEWMA_DESK_DOMAIN_SUITE_WORKSPACE_VENVS: "false"
  NEWMA_DESK_INVESTMENT_WORKSPACE: /app/mod-projects/vibe-research
  NEWMA_DESK_TRADING_WORKSPACE: /app/mod-projects/vibe-trading
  NEWMA_DESK_PROJECTS_ROOT: /projects
  NEWMA_DESK_DESKTOP_PROJECTS_ROOT: /projects
  NEWMA_DESK_RUNTIME_DIR: /app/runtime
  NEWMA_DESK_DATABASE_PATH: /app/runtime/newma-desk.db

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      target: api-runtime
    image: newma-desk:api
    profiles: ["core", "ops"]
    restart: unless-stopped
    init: true
    mem_limit: ${NEWMA_DESK_API_MEMORY_LIMIT:-768m}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    env_file: .env.server
    environment:
      <<: *core-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8911:8911"
    volumes:
      - ../../runtime:/app/runtime
      - /opt/newma-projects:/projects
      - ../../runtime/codex-home:/root/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8911/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  desk:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      target: desk-runtime
    image: newma-desk:desk
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: ${NEWMA_DESK_STATIC_MEMORY_LIMIT:-96m}
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5888:5888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  register-mods:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      target: ops-runtime
    image: newma-desk:ops
    profiles: ["ops"]
    mem_limit: 128m
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.server
    environment:
      <<: *core-environment
      NEWMA_DESK_CONTROL_PLANE_URL: http://api:8911
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: ${NEWMA_DESK_STATIC_MEMORY_LIMIT:-96m}
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    depends_on:
      desk:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
